[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcom"
version = "0.1.0.dev10"
description = "Turn your group chat into your favorite TV series: an episode starring your friends."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bryan Bartlett" }]
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "certifi>=2024.2.2"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatcom = "chatcom.cli:main"

[project.urls]
Homepage = "https://b2b-content-systems.github.io/chatcom/"
Repository = "https://github.com/b2b-content-systems/chatcom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatcom = ["schemas/*.json", "prompts/*.md", "render_templates/*", "runtime/package.json", "runtime/package-lock.json",
           "assets/fonts/*.woff2", "assets/fonts/*.txt", "assets/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
